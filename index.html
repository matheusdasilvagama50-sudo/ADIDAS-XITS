<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AUXÍLIO ADIDAS</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* MATRIX */
canvas {
  position: fixed;
  z-index: 0;
}

/* LOGIN */
.login {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #0a0000;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 0 30px red;
  border: 2px solid red;
  text-align: center;
}

.login input {
  margin-top: 10px;
  padding: 12px;
  border-radius: 25px;
  border: none;
  width: 220px;
  background: #111;
  color: white;
}

.login button {
  margin-top: 10px;
  padding: 12px;
  width: 220px;
  border-radius: 25px;
  border: none;
  background: red;
  color: white;
  box-shadow: 0 0 15px red;
}

/* APP */
.app {
  display: none;
}

/* BOX */
.box {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 330px;
  background: #0a0000;
  border-radius: 20px;
  border: 2px solid red;
  box-shadow: 0 0 40px red;
  padding: 20px;
}

/* MENU LATERAL */
.menu {
  position: absolute;
  left: -55px;
  top: 10px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.menu div {
  width: 40px;
  height: 40px;
  background: #140000;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 15px red;
  cursor: pointer;
}

/* TITULO */
.title {
  color: red;
  margin-bottom: 15px;
}

/* TAB */
.tab {
  display: none;
}
.tab.active {
  display: block;
}

/* OPTION */
.option {
  background: #140000;
  padding: 12px;
  border-radius: 20px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* TOGGLE */
.switch {
  width: 40px;
  height: 20px;
  background: #333;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}

.switch::after {
  content: "";
  width: 18px;
  height: 18px;
  background: white;
  position: absolute;
  top: 1px;
  left: 1px;
  border-radius: 50%;
  transition: 0.3s;
}

.switch.active {
  background: red;
}
.switch.active::after {
  left: 21px;
}

/* SLIDER */
input[type=range] {
  width: 100%;
  accent-color: red;
}

/* BOTÃO */
.btn {
  background: red;
  padding: 12px;
  border-radius: 20px;
  text-align: center;
  margin-top: 10px;
  box-shadow: 0 0 15px red;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div class="login" id="login">
  <h2 style="color:red">AUXÍLIO ADIDAS</h2>
  <input id="key" placeholder="Digite sua key">
  <br>
  <button onclick="entrar()">ENTRAR</button>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="box">

    <div class="menu">
      <div onclick="trocar(0)">🎯</div>
      <div onclick="trocar(1)">➕</div>
      <div onclick="trocar(2)">☷</div>
      <div onclick="trocar(3)">🛡️</div>
      <div onclick="trocar(4)">⚔️</div>
      <div onclick="trocar(5)">ℹ️</div>
    </div>

    <!-- AIMBOT -->
    <div class="tab active">
      <div class="title">AIMBOT</div>
      <div class="option">Aimbot 89% <div class="switch" onclick="toggle(this)"></div></div>
      <div class="option">Aumentar Precisão <div class="switch" onclick="toggle(this)"></div></div>
      <input type="range">
    </div>

    <!-- ARMA -->
    <div class="tab">
      <div class="title">ARMA</div>
      <div class="option">Sem Recuo <div class="switch" onclick="toggle(this)"></div></div>
      <div class="option">Precisão Avançada <div class="switch" onclick="toggle(this)"></div></div>
    </div>

    <!-- DIVERSOS -->
    <div class="tab">
      <div class="title">DIVERSOS</div>
      <div class="option">120 FPS <div class="switch" onclick="toggle(this)"></div></div>
      <div class="option">OTIMIZAÇÃO <div class="switch" onclick="toggle(this)"></div></div>
    </div>

    <!-- SEGURANÇA -->
    <div class="tab">
      <div class="title">SEGURANÇA</div>
      <input type="range">
    </div>

    <!-- INJEÇÃO -->
    <div class="tab">
      <div class="title">INJEÇÃO</div>
      <div class="btn">ABRIR FREE FIRE</div>
      <div class="btn">ABRIR FREE FIRE MAX</div>
    </div>

    <!-- INFO -->
    <div class="tab">
      <div class="title">INFORMAÇÕES</div>
      <p style="color:white">Criado por CENTRAL HACK</p>
    </div>

  </div>
</div>

<script>
function entrar(){
  if(document.getElementById("key").value === "#AUXÍLIOADIDAS"){
    login.style.display="none";
    app.style.display="block";
  } else alert("Key inválida");
}

function trocar(i){
  let tabs = document.querySelectorAll(".tab");
  tabs.forEach(t=>t.classList.remove("active"));
  tabs[i].classList.add("active");
}

function toggle(el){
  el.classList.toggle("active");
}

/* MATRIX */
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;

const letters="アイウエオ0123456789";
const size=14;
const cols=c.width/size;
let drops=[];

for(let i=0;i<cols;i++) drops[i]=1;

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle="red";
  ctx.font=size+"px monospace";

  for(let i=0;i<drops.length;i++){
    let text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*size,drops[i]*size);

    if(drops[i]*size>c.height && Math.random()>0.975)
      drops[i]=0;

    drops[i]++;
  }
}
setInterval(draw,33);
</script>

</body>
</html>
