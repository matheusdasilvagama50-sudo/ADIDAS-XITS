<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Central Hack UI</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 20px;
      border: 2px solid red;
      box-shadow: 0 0 25px red;
      width: 300px;
    }

    h1 {
      color: #ff4d4d;
      letter-spacing: 3px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 25px;
      border: none;
      outline: none;
      background: #111;
      color: white;
      text-align: center;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      background: red;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px red;
      transition: 0.3s;
    }

    button:hover {
      box-shadow: 0 0 30px red;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <h1>CENTRAL HACK</h1>
  <input type="text" placeholder="Digite sua key">
  <button onclick="alert('Acesso liberado (fake 😎)')">ENTRAR</button>
</div>

<script>
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;

  const letters = "アイウエオカキクケコサシスセソ0123456789";
  const fontSize = 16;
  const columns = canvas.width / fontSize;

  const drops = [];

  for (let x = 0; x < columns; x++)
    drops[x] = 1;

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff0000";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
        drops[i] = 0;

      drops[i]++;
    }
  }

  setInterval(draw, 33);
</script>

</body>
</html>
